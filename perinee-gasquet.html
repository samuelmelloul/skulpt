<style>

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

  --breath:#7FCBB7; --breath-soft:#1D3530; --cardio:#F19A5E; --cardio-soft:#3A2414;

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}

p{margin:0}

button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px;display:grid;gap:18px}
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0}
.btn{border:0;border-radius:999px;padding:14px 22px;font-weight:600;background:var(--accent);color:var(--accent-ink);font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

ul.clean,ol.clean{margin:0;padding-left:1.1em;display:grid;gap:4px}
.num{font-variant-numeric:tabular-nums}

.week i.today{outline:2px solid var(--accent);outline-offset:1px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}

details.phase{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

details.phase summary::-webkit-details-marker{display:none}
details.phase .body{padding:0 16px 16px;display:grid;gap:12px}
.lib{display:grid;gap:8px}
.lib button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:.95rem}
.lib button:focus-visible{outline:3px solid var(--accent)}
.sheet{position:fixed;inset:0;background:rgba(20,10,18,.45);display:grid;align-items:end;z-index:20}
.sheet .panel{background:var(--surface);border-radius:20px 20px 0 0;max-height:90vh;overflow:auto;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;max-width:600px;width:100%;margin:0 auto;box-sizing:border-box}
.fig{width:100%;max-width:420px;margin:0 auto;aspect-ratio:160/124;background:var(--sunk);border-radius:16px;overflow:hidden}
.fig svg{display:block;width:100%;height:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.hist{list-style:none;margin:0;padding:0;display:grid}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.hist li:first-child{border-top:0}
input[type=number],select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=number]{width:6.5em}
.form{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.form label{font-size:.95rem}
.prose{display:grid;gap:10px}
.rule{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.rule .k{font-family:var(--f-display);font-weight:700;color:var(--accent);font-size:1.1rem;line-height:1.3}
.meal{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .t{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meal .k{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;grid-row:1;grid-column:2}
.meal p{grid-column:1 / -1}
.daynav{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:center}
.refs{font-size:.85rem;display:grid;gap:6px;padding-left:1.1em;margin:0}
/* lecteur */
.player{position:fixed;inset:0;background:var(--bg);z-index:30;display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.player .head,.player .ctl{padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.player .head{display:grid;gap:8px}
.prog{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.stage{display:grid;place-items:center;padding:4px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.stage-in{width:100%;max-width:520px;display:grid;gap:12px;justify-items:center;text-align:center}
.stage .fig{max-height:34vh;width:auto;max-width:100%}
.cue{font-family:var(--f-display);font-size:clamp(1.35rem,6vw,2rem);font-weight:700;line-height:1.15;text-wrap:balance;min-height:2.3em;display:grid;place-items:center}
.viz{display:flex;gap:18px;align-items:center;justify-content:center}
.col{position:relative;width:34px;height:116px;border-radius:17px;background:var(--sunk);overflow:hidden}
.col i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--breath);border-radius:17px}
.col-labels{height:116px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;font-size:.7rem;color:var(--muted);padding-block:4px}
.ring{position:relative;width:116px;height:116px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:2.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.reps{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.intro{text-align:left;width:100%;display:grid;gap:10px}
.ctl{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.ctl .iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:50px;height:50px;display:grid;place-items:center}
.ctl .iconbtn svg{width:22px;height:22px}
.ctl .main{width:68px;height:68px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.ctl .main svg{width:28px;height:28px}
.choice{display:grid;gap:8px}
.choice button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;font-size:1rem}
.choice button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:40;max-width:90vw;text-align:center}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>

<script>
// DATA START
const IN="Inspirez, sans forcer", EX="Expirez : périnée, puis nombril", REC="Récupérez en marchant doucement";
const EXOS={
  install:{n:"Installation, bassin surélevé",pos:"Allongée sur le dos, un coussin ferme sous les fesses (pas sous le dos), genoux fléchis.",why:"Le bassin plus haut que le ventre : les organes remontent d’eux‑mêmes. C’est la position de départ idéale en cas de descente d’organes.",how:["Glissez le coussin sous le bassin.","Rentrez légèrement le menton pour allonger la nuque.","Laissez le ventre se relâcher complètement."],avoid:["Cambrer le bas du dos","Bloquer la respiration"],cycle:[["in",4,"Inspirez par le nez, laissez venir l’air"],["ex",6,"Soufflez lentement, tout se relâche"]]},
  paille:{n:"Souffle dans la paille",pos:"Bassin surélevé, comme pour l’installation.",why:"Une expiration longue, lèvres presque fermées, fait remonter le diaphragme et réveille le transverse sans pousser vers le bas.",how:["Inspirez par le nez sans gonfler le ventre de force.","Soufflez par la bouche comme dans une paille, régulièrement, jusqu’au bout.","En fin de souffle, sentez le bas du ventre rentrer tout seul."],avoid:["Pousser le ventre vers l’avant","Souffler fort et vite"],cycle:[["in",3,IN],["ex",7,"Soufflez dans la paille… jusqu’au bout"]]},
  perception:{n:"Repérer son périnée",pos:"Bassin surélevé, genoux fléchis, cuisses relâchées.",why:"On ne renforce bien que ce qu’on sent. Le périnée a trois zones : l’anus, le vagin, l’urètre. On apprend à les fermer et à les remonter sans tricher avec les fesses.",how:["Serrez l’anus comme pour retenir un gaz.","Puis le vagin, comme pour le refermer et l’aspirer vers l’intérieur.","Puis l’avant, comme pour retenir l’urine. Remontez le tout vers le haut.","Relâchez entièrement, plus longtemps que la contraction."],avoid:["Serrer les fesses ou les cuisses","Bloquer le souffle","Pousser vers le bas","Faire le « stop‑pipi » aux toilettes"],cycle:[["hold",3,"Serrez… et remontez"],["rest",6,"Relâchez tout"]]},
  souffle:{n:"Expiration Gasquet",pos:"Bassin surélevé, ou assise selon le niveau.",why:"Le geste central de la méthode : l’expiration commence par le bas. Périnée d’abord, puis bas‑ventre, puis nombril. Le ventre rentre sans jamais pousser vers le bas.",how:["Inspirez sans forcer.","Au début du souffle : fermez et remontez le périnée.","Continuez de souffler : le bas‑ventre rentre, puis le nombril va vers la colonne.","Relâchez tout à l’inspiration suivante."],avoid:["Rentrer le ventre en inspirant","Contracter d’abord le nombril (ça pousse vers le bas)","Apnée"],cycle:[["in",3,IN],["ex",7,EX]]},
  bascule:{n:"Bascule du bassin",pos:"Allongée, genoux fléchis, pieds à plat, bras le long du corps.",why:"Mobilise le bas du dos et coordonne le souffle avec le mouvement, sans hyperpression.",how:["Inspirez : le bas du dos garde son petit creux naturel.","Expirez : périnée, puis enroulez le bassin, le bas du dos se pose au sol, les fesses décollent à peine.","Revenez en inspirant."],avoid:["Pousser avec les pieds pour monter haut","Bloquer"],cycle:[["in",3,"Inspirez, bassin neutre"],["ex",5,"Expirez : périnée, enroulez le bassin"]]},
  genoux:{n:"Genoux vers la poitrine",pos:"Allongée, mains sur les genoux.",why:"Détend le bas du dos et le périnée entre deux exercices.",how:["Amenez les genoux vers la poitrine avec les mains.","Faites de petits cercles, respirez librement.","Reposez les pieds un par un."],avoid:["Lever les deux jambes tendues"],cycle:[["free",45,"Petits cercles, respirez librement"]]},
  relax:{n:"Relaxation jambes surélevées",pos:"Allongée, mollets sur une chaise, bassin sur coussin.",why:"On termine organes « remontés », périnée relâché. Le relâchement fait partie du travail.",how:["Fermez les yeux.","Laissez l’expiration s’allonger d’elle‑même.","Pour vous relever, roulez sur le côté et poussez avec les bras."],avoid:["Se relever d’un coup en relevant le buste"],cycle:[["in",4,"Inspirez doucement"],["ex",7,"Expirez, relâchez tout"]]},
  lentes:{n:"Contractions lentes (endurance)",pos:"Selon le niveau : allongée, à quatre pattes, assise ou debout.",why:"Les fibres lentes tiennent les organes toute la journée. On travaille la tenue, toujours en respirant.",how:["Serrez et remontez le périnée, puis tenez.","Pendant la tenue, continuez à respirer en petites expirations.","Relâchez complètement, au moins aussi longtemps que la tenue."],avoid:["Retenir son souffle pendant la tenue","Serrer les fesses","Faiblir à la fin : arrêtez la tenue avant"],cycle:[["hold",5,"Serrez, remontez, tenez en respirant"],["rest",10,"Relâchez complètement"]]},
  rapides:{n:"Contractions rapides (réflexe)",pos:"Selon le niveau.",why:"Les fibres rapides ferment le périnée d’un coup lors d’une toux, d’un rire, d’un effort brusque.",how:["Serrez fort et vite, puis lâchez aussitôt.","Gardez un souffle tranquille.","Si la qualité baisse, faites une pause."],avoid:["Pousser en relâchant","Contracter les abdos en même temps"],cycle:[["hold",1,"Serrez !"],["rest",2,"Lâchez"]]},
  clam:{n:"Coquillage sur le côté",pos:"Allongée sur le côté, genoux fléchis, tête posée sur le bras.",why:"Réveille les fessiers profonds, partenaires du périnée, sans aucune pression vers le bas.",how:["Inspirez, genoux joints.","Expirez : périnée, puis ouvrez le genou du dessus, pieds collés.","Refermez en inspirant."],avoid:["Basculer le bassin en arrière","Bloquer le souffle"],cycle:[["in",2,"Inspirez, genoux joints"],["ex",4,"Expirez : périnée, ouvrez le genou"]],sides:true},
  qp:{n:"Quatre pattes : expiration",pos:"À quatre pattes, mains sous les épaules, genoux sous les hanches, dos long, nuque dans l’alignement.",why:"À quatre pattes, les organes pendent vers l’avant et non vers le bas : le transverse travaille dans la bonne direction.",how:["Inspirez : laissez le ventre descendre sans creuser le dos.","Expirez : périnée, puis remontez le ventre vers le dos.","Le dos reste plat, il ne s’arrondit pas."],avoid:["Creuser les lombaires","Rentrer le ventre en inspirant"],cycle:[["in",3,"Inspirez, le ventre se relâche"],["ex",6,"Expirez : périnée, le ventre remonte"]]},
  chat:{n:"Le chat, version souffle",pos:"À quatre pattes.",why:"Mobilise toute la colonne en associant l’enroulement à l’expiration.",how:["Expirez : périnée, puis enroulez le dos de bas en haut, la tête descend en dernier.","Inspirez : revenez au dos plat, sans cambrer.","Grandissez‑vous : tête et coccyx s’éloignent."],avoid:["Cambrer fort au retour","Aller vite"],cycle:[["ex",5,"Expirez : périnée, enroulez le dos"],["in",3,"Inspirez, revenez dos plat"]]},
  coudes:{n:"Coudes‑genoux",pos:"Genoux au sol, avant‑bras posés, fesses plus hautes que la tête.",why:"Posture « anti‑pesanteur » : les organes remontent vers le diaphragme. Très utile en cas de descente d’organes.",how:["Placez‑vous, front sur les mains si besoin.","Inspirez sans forcer.","Expirez : périnée, puis ventre vers le dos. Sentez tout remonter."],avoid:["Rester si la tête tourne"],cycle:[["in",3,IN],["ex",7,"Expirez : tout remonte vers la poitrine"]]},
  enfant:{n:"Posture de l’enfant",pos:"À genoux, fesses vers les talons, front au sol ou sur un coussin, bras en avant.",why:"Étire le dos et relâche le périnée en fin de séance.",how:["Écartez un peu les genoux si besoin.","Respirez dans le dos.","Laissez le périnée se relâcher."],avoid:["Forcer sur les genoux"],cycle:[["free",60,"Respirez dans le dos, relâchez"]]},
  assise:{n:"Assise sur les ischions",pos:"Assise au bord d’une chaise, pieds à plat, genoux un peu plus bas que les hanches.",why:"Être bien posée sur les deux os des fesses (ischions) place le bassin : le périnée peut travailler et le dos se tient seul.",how:["Balancez le bassin pour sentir les deux ischions, puis posez‑vous dessus.","Inspirez sans forcer.","Expirez : périnée, nombril, et poussez le sommet du crâne vers le plafond."],avoid:["S’avachir sur le sacrum","Cambrer pour « se tenir droite »"],cycle:[["in",3,IN],["ex",6,"Expirez : périnée, nombril, grandissez‑vous"]]},
  bras:{n:"Grandissement bras levés",pos:"Assise sur les ischions.",why:"L’auto‑grandissement sur l’expiration : la colonne s’étire, le ventre s’affine, les organes remontent.",how:["Mains au‑dessus de la tête, paumes vers le plafond.","Expirez : périnée, nombril, et poussez les paumes vers le plafond.","Inspirez en relâchant un peu."],avoid:["Hausser les épaules","Cambrer"],cycle:[["in",3,"Inspirez, coudes souples"],["ex",6,"Expirez : poussez le plafond, grandissez"]]},
  torsion:{n:"Torsion assise",pos:"Assise sur les ischions, main opposée sur le genou.",why:"Les obliques affinent la taille ; la torsion se fait en grandissement, jamais en se tassant.",how:["Inspirez en vous grandissant.","Expirez : périnée, puis tournez le buste, le regard suit.","Revenez au centre en inspirant."],avoid:["S’arrondir","Forcer sur la nuque"],cycle:[["in",3,"Inspirez au centre"],["ex",5,"Expirez : périnée, tournez"]],sides:true},
  pont:{n:"Pont fessier",pos:"Allongée, genoux fléchis, pieds à largeur de hanches.",why:"Fessiers, arrière des cuisses et périnée ensemble. Le bassin monte, les organes restent hauts.",how:["Inspirez en bas.","Expirez : périnée, puis décollez le bassin en déroulant le dos.","Tenez en haut en respirant doucement.","Redescendez vertèbre par vertèbre."],avoid:["Monter en apnée","Cambrer en haut"],cycle:[["in",3,"Inspirez en bas"],["ex",4,"Expirez : périnée, montez le bassin"],["hold",3,"Tenez, souffle doux"],["rest",3,"Redescendez en déroulant"]]},
  ours:{n:"Genoux décollés (l’ours)",pos:"À quatre pattes, orteils repliés.",why:"Premier gainage, court, toujours sur l’expiration : le transverse tient, rien ne pousse vers le bas.",how:["Inspirez à quatre pattes.","Expirez : périnée, nombril, puis décollez les genoux de 2 cm.","Reposez les genoux en inspirant."],avoid:["Lever les fesses","Bloquer le souffle"],cycle:[["in",3,"Inspirez, genoux au sol"],["ex",6,"Expirez : périnée, décollez les genoux"]]},
  oiseau:{n:"Bras‑jambe opposés",pos:"À quatre pattes, dos long.",why:"Stabilité du bassin et du dos, avec un dos qui reste long.",how:["Inspirez.","Expirez : périnée, puis tendez un bras et la jambe opposée, à l’horizontale.","Revenez en inspirant."],avoid:["Lever la jambe trop haut (cambrure)","Tourner le bassin"],cycle:[["in",3,"Inspirez"],["ex",5,"Expirez : périnée, bras et jambe opposés"]],sides:true},
  debout:{n:"Posture debout",pos:"Debout, pieds à largeur de hanches, genoux souples.",why:"La posture du quotidien : poids réparti, bassin neutre, tête qui monte. C’est elle qui protège le périnée toute la journée.",how:["Répartissez le poids entre talons et avant des pieds.","Inspirez sans forcer.","Expirez : périnée, nombril, sommet du crâne vers le ciel."],avoid:["Verrouiller les genoux","Bomber le ventre"],cycle:[["in",3,IN],["ex",6,"Expirez : périnée, nombril, grandissez"]]},
  toux:{n:"Verrouillage avant la toux",pos:"Debout.",why:"Le réflexe le plus utile au quotidien : fermer le périnée avant une toux, un éternuement, un rire, un port de charge.",how:["Serrez et remontez le périnée.","Toussez (ou faites « Ha ! ») en gardant le verrouillage.","Relâchez."],avoid:["Tousser d’abord, serrer ensuite","Se plier en deux en toussant"],cycle:[["hold",2,"Verrouillez le périnée"],["move",1,"Toussez !"],["rest",4,"Relâchez"]]},
  lever:{n:"Se lever de la chaise",pos:"Assise au bord d’une chaise, pieds un peu en arrière.",why:"Geste répété 50 fois par jour : on apprend à le faire sur l’expiration, périnée verrouillé.",how:["Inspirez assise.","Expirez : périnée, puis penchez‑vous en avant et levez‑vous en poussant dans les talons.","Rasseyez‑vous doucement en inspirant, fesses en arrière."],avoid:["Se lever en apnée","Se laisser tomber sur la chaise"],cycle:[["in",3,"Inspirez assise"],["ex",4,"Expirez : périnée, levez‑vous"],["in",3,"Rasseyez‑vous doucement"]]},
  squat:{n:"Squat vers la chaise",pos:"Debout devant une chaise, pieds largeur de hanches.",why:"Le plus efficace pour les cuisses et les fessiers, donc pour dépenser. Le souffle protège le périnée à la remontée.",how:["Inspirez en descendant, fesses vers l’arrière, jusqu’à frôler la chaise.","Expirez : périnée d’abord, puis remontez en poussant dans les talons.","Le dos reste long, le regard devant."],avoid:["Remonter en apnée","Genoux qui rentrent vers l’intérieur"],cycle:[["in",3,"Inspirez, descendez"],["ex",3,"Expirez : périnée, remontez"]]},
  fente:{n:"Fente statique",pos:"Un pied devant, l’autre derrière sur la pointe, main sur une chaise si besoin.",why:"Renforce chaque jambe séparément, améliore l’équilibre.",how:["Inspirez en descendant le genou arrière vers le sol.","Expirez : périnée, remontez.","Le buste reste droit, grandi."],avoid:["Genou avant qui dépasse loin le pied","Se pencher en avant"],cycle:[["in",3,"Inspirez, descendez"],["ex",3,"Expirez : périnée, remontez"]],sides:true},
  inclinee:{n:"Planche inclinée",pos:"Mains sur un plan de travail ou une table solide, corps en ligne, pieds en arrière.",why:"Le gainage du tronc à faible charge : plus le support est haut, plus c’est doux.",how:["Placez‑vous, corps droit de la tête aux talons.","Pendant toute la tenue, respirez en expirations actives : périnée, nombril.","Ne bloquez jamais."],avoid:["Ventre qui pend","Fesses en l’air","Apnée"],cycle:[["in",3,"Inspirez, restez gainée"],["ex",6,"Expirez : périnée, nombril, tenez"]]},
  latdebout:{n:"Étirement latéral",pos:"Debout, un bras au‑dessus de la tête.",why:"Ouvre les côtes, libère la respiration, termine la séance en douceur.",how:["Grandissez‑vous d’abord.","Expirez en penchant doucement sur le côté, le bras passe au‑dessus.","Respirez dans les côtes étirées."],avoid:["S’affaisser sur le côté"],cycle:[["free",20,"Étirez‑vous, respirez dans les côtes"]],sides:true},
  planche:{n:"Planche sur les genoux",pos:"Sur les avant‑bras et les genoux, corps en ligne des épaules aux genoux.",why:"Gainage complet, toujours sous contrôle du souffle. Si vous sentez une pesanteur, revenez à la planche inclinée.",how:["Placez‑vous, coudes sous les épaules.","Tenez en faisant de petites expirations actives : périnée, nombril.","Reposez‑vous à quatre pattes pendant la récupération."],avoid:["Apnée","Ventre qui pousse vers le sol","Continuer en cas de pesanteur"],cycle:[["hold",20,"Tenez : petites expirations, périnée"],["rest",15,"Reposez‑vous à quatre pattes"]]},
  pontuni:{n:"Pont sur une jambe",pos:"Allongée, genoux fléchis, une jambe tendue dans l’axe de l’autre cuisse.",why:"Version plus forte du pont : fessier de chaque côté, stabilité du bassin.",how:["Inspirez en bas.","Expirez : périnée, montez le bassin sur une jambe.","Redescendez en inspirant, sans que le bassin penche."],avoid:["Bassin qui tourne","Apnée"],cycle:[["in",3,"Inspirez en bas"],["ex",4,"Expirez : périnée, montez"]],sides:true},

const INTRO_S=12, SWITCH_S=5;
function itemSeconds(it){const e=EXOS[it[0]];const c=cycleOf(it);const per=c.reduce((a,s)=>a+s[1],0);return per*it[1]*(e.sides?2:1)+(e.sides?SWITCH_S:0)+INTRO_S}
function cycleOf(it){const e=EXOS[it[0]];if(!it[2])return e.cycle;let k=0;return e.cycle.map(s=>[s[0],it[2][k++]??s[1],s[2]])}
function sessionSeconds(list){return list.reduce((a,it)=>a+itemSeconds(it),0)}

function repsLabel(it){const e=EXOS[it[0]],c=cycleOf(it);if(c.length===1&&c[0][0]==="free")return c[0][1]+" s"+(e.sides?" × 2 côtés":"");if(e.c)return it[1]+" × "+c[0][1]+" s";return it[1]+(e.sides?" × 2 côtés":" fois")}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dec=n=>String(n).replace(".",",");
const lastKg=()=>{const w=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);return w[w.length-1].kg};
const r50=x=>Math.round(x/50)*50;
function nutri(){
  const p=S.profile,kg=lastKg();
  const bmr=10*kg+6.25*p.h-5*p.age-161,tdee=bmr*ACT[p.act][0];
  const target=p.allait?Math.max(1800,r50(tdee+200)):Math.max(1400,r50(tdee-450));
  const lossW=Math.max(0,(tdee+(p.allait?500:0)-target)*7/7700);
  return {bmr,tdee,target,prot:Math.round(kg*1.3/5)*5,lossW,kg};
}

function chart(w){
  if(w.length<2)return `<p class="small muted">Ajoutez une deuxième pesée pour voir la courbe. Départ : <span class="num">${dec(w[0].kg)} kg</span>.</p>`;
  const W=320,H=140,pl=34,pr=10,pt=12,pb=22;
  const xs=w.map(p=>dnum(p.d)),ys=w.map(p=>p.kg);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.floor(Math.min(...ys)-1),y1=Math.ceil(Math.max(...ys)+1);
  const X=t=>pl+(W-pl-pr)*((t-x0)/((x1-x0)||1)),Y=v=>pt+(H-pt-pb)*(1-(v-y0)/((y1-y0)||1));
  const pts=w.map((p,i)=>[X(xs[i]),Y(p.kg)]);
  const line=pts.map((p,i)=>(i?"L":"M")+f1(p[0])+" "+f1(p[1])).join(" ");
  const area=line+` L${f1(pts[pts.length-1][0])} ${H-pb} L${f1(pts[0][0])} ${H-pb} Z`;
  const ticks=[...new Set([y0,Math.round((y0+y1)/2),y1])],lp=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de poids">
   ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${t}</text>`).join("")}
   <path d="${area}" fill="var(--breath-soft)" stroke="none"/>
   <path d="${line}" fill="none" stroke="var(--breath)" stroke-width="2.5" stroke-linejoin="round"/>
   <circle cx="${lp[0]}" cy="${lp[1]}" r="4.5" fill="var(--breath)"/>
   <text x="${pl}" y="${H-6}" font-size="10" fill="var(--muted)">${fmtDate(w[0].d)}</text>
   <text x="${W-pr}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--muted)">${fmtDate(w[w.length-1].d)}</text>
  </svg>`;
}

function vMethod(){
  return `<div class="wrap prose">
  <header class="top"><div class="eyebrow">Approche posturo‑respiratoire (APOR)</div><h1>La méthode de Gasquet</h1></header>
  <p>Médecin et professeure de yoga, Bernadette de Gasquet a construit une approche qui part d’un constat : la plupart des exercices d’abdominaux classiques poussent les organes vers le bas et abîment le périnée. Sa méthode associe posture, respiration et périnée, et ne fait jamais travailler l’un sans les autres.</p>
  <section class="card"><h3>Les cinq règles</h3>
    <div class="rule"><span class="k">1</span><p><b>L’expiration commence par le bas.</b> On ferme et remonte le périnée, puis le bas‑ventre rentre, puis le nombril. Jamais l’inverse : serrer d’abord la taille pousse les organes vers le bas.</p></div>
    <div class="rule"><span class="k">2</span><p><b>L’effort se fait sur l’expiration.</b> Se lever, soulever, monter, tenir une position : toujours en soufflant. Jamais en apnée.</p></div>
    <div class="rule"><span class="k">3</span><p><b>Se grandir.</b> Éloigner le sommet du crâne du coccyx (auto‑grandissement) étire la colonne, affine la taille et fait remonter les organes.</p></div>
    <div class="rule"><span class="k">4</span><p><b>Ne jamais pousser vers le bas.</b> Pas de ventre bombé à l’effort, pas de poussée aux toilettes, pas d’abdominaux en « crunch ».</p></div>
    <div class="rule"><span class="k">5</span><p><b>Verrouiller avant l’effort.</b> Serrer le périnée avant de tousser, éternuer, rire, porter. Ce réflexe s’apprend puis devient automatique.</p></div>
  </section>
  <section class="card"><h3>Ce qu’on évite</h3><ul class="clean">
    <li>Les relevés de buste, crunchs et « abdos » classiques.</li>
    <li>Lever les deux jambes tendues allongée sur le dos.</li>
    <li>Rentrer le ventre en permanence ou en inspirant.</li>
    <li>L’apnée et les grandes inspirations avant l’effort.</li>
    <li>Le « stop‑pipi » comme exercice.</li>
    <li>Sauts, course, corde à sauter, trampoline et charges lourdes, tant qu’un bilan ne les a pas autorisés.</li>
  </ul></section>
  <section class="card"><h3>Pourquoi cet ordre</h3>
    <p>Avec une descente d’organes, la pesanteur est l’ennemie du début. On commence donc bassin surélevé et à quatre pattes, là où les organes remontent d’eux‑mêmes. On se redresse ensuite : assise, debout, puis en mouvement.</p>
    <p>On travaille les deux types de fibres du périnée : les fibres lentes (tenues de 3 à 10 secondes) et les fibres rapides (contractions d’une seconde, pour la toux et le rire). Le relâchement compte autant que la contraction.</p>
    <p>Le cardio est toujours sans impact : marche active, boxe dans le vide, pas latéraux, montées de marche. Il passe d’environ 5 minutes au niveau 1 à une douzaine de minutes au niveau 6, en intervalles.</p>
  </section>
  <section class="card"><h3>Pour perdre du poids</h3>
    <p>Les séances construisent du muscle et font monter le cœur. Elles ne suffisent pas seules : les deux autres leviers sont 2 à 3 marches rapides de 30 minutes par semaine et l’alimentation (onglet Repas). Visez une perte lente, 0,5 kg par semaine au plus.</p>
  </section>
  <div class="notice"><b>Quand consulter</b><span>Sensation de boule ou de pesanteur qui augmente, fuites qui s’aggravent, douleur, saignement : arrêtez les exercices concernés et voyez le médecin, la sage‑femme ou le kiné. Avant de reprendre course ou sauts, faites un bilan du périnée.</span></div>
  <section class="card"><h3>Références</h3>
    <ol class="refs">
      <li>B. de Gasquet, <i>Abdominaux : arrêtez le massacre !</i>, Marabout. Principes APOR, expiration de bas en haut, exercices à éviter.</li>
      <li>B. de Gasquet, <i>Périnée : arrêtons le massacre !</i>, Marabout. Verrouillage, positions, toilettes.</li>
      <li>S. Hagen et al., « Individualised pelvic floor muscle training in women with pelvic organ prolapse (POPPY) », <i>The Lancet</i>, 2014;383:796‑806. Le renforcement du périnée réduit les symptômes de prolapsus.</li>
      <li>NICE, guideline NG210 « Pelvic floor dysfunction », 2021. Au moins 3 mois de renforcement du périnée, encadré.</li>
      <li>Cochrane, Dumoulin et al., 2018 : renforcement du périnée et incontinence urinaire chez la femme.</li>
      <li>OMS, recommandations sur l’activité physique, 2020 : 150 minutes d’activité modérée par semaine et du renforcement musculaire 2 fois par semaine.</li>
      <li>Mifflin et St Jeor, <i>Am J Clin Nutr</i>, 1990. Équation utilisée pour le métabolisme de base.</li>
      <li>Santé publique France, recommandations nutritionnelles (mangerbouger.fr) : légumes, fibres, féculents complets, légumineuses.</li>
    </ol>
  </section>
  <p class="small muted">Programme conçu d’après ces principes ; il ne remplace pas une rééducation encadrée.</p>
  </div>`;
}

let PL=null;
function buildSteps(list){
  const steps=[];
  list.forEach((it,xi)=>{
    const e=EXOS[it[0]],c=cycleOf(it);
    steps.push({type:"intro",xi,id:it[0],t:INTRO_S});
    (e.sides?["Côté droit","Côté gauche"]:[null]).forEach((side,si)=>{
      if(si>0)steps.push({type:"step",xi,id:it[0],k:"move",t:SWITCH_S,txt:"Changez de côté",side:"Côté gauche",rep:0,reps:it[1],mirror:1});
      for(let r=0;r<it[1];r++)c.forEach(s=>steps.push({type:"step",xi,id:it[0],k:s[0],t:s[1],txt:s[2],side,rep:r+1,reps:it[1],mirror:si}));
    });
  });
  return steps;
}
let actx=null,sound=true;
function beep(k){if(!sound||!actx)return;try{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value={in:440,ex:620,hold:700,rest:360,move:880,free:520,cardio:780,intro:500}[k]||500;o.type="sine";g.gain.setValueAtTime(.0001,actx.currentTime);g.gain.exponentialRampToValueAtTime(.18,actx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.25);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.3)}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(k==="ex"||k==="hold"||k==="cardio"?60:25)}catch(e){}}
let wake=null;
async function lockWake(){try{wake=await navigator.wakeLock.request("screen")}catch(e){}}
function startSession(){
  const p=P(),L=nextLetter(),list=p[L];
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
  lockWake();
  PL={L,list,steps:buildSteps(list),i:0,elapsed:0,paused:false,last:performance.now(),t0:Date.now(),from:0,to:0,lastDraw:0};
  PL.total=PL.steps.reduce((a,s)=>a+s.t,0);
  layer.innerHTML=`<div class="player" role="dialog" aria-label="Séance en cours">
    <div class="head"><div class="spread"><span class="eyebrow" id="pl-ex"></span><button class="btn ghost sm" id="pl-quit">Quitter</button></div><div class="prog"><i id="pl-prog"></i></div></div>
    <div class="stage"><div class="stage-in" id="pl-stage"></div></div>
    <div class="ctl">
      <div style="display:flex;gap:10px;justify-content:flex-end"><button class="iconbtn" id="pl-prev" aria-label="Exercice précédent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button></div>
      <button class="main" id="pl-play" aria-label="Pause"></button>
      <div style="display:flex;gap:10px"><button class="iconbtn" id="pl-next" aria-label="Exercice suivant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button><button class="iconbtn" id="pl-snd" aria-label="Son"></button></div>
    </div></div>`;
  document.getElementById("pl-quit").onclick=confirmQuit;
  document.getElementById("pl-play").onclick=()=>{PL.paused=!PL.paused;PL.last=performance.now();drawCtl()};
  document.getElementById("pl-next").onclick=()=>jumpEx(1);
  document.getElementById("pl-prev").onclick=()=>jumpEx(-1);
  document.getElementById("pl-snd").onclick=()=>{sound=!sound;drawCtl()};
  drawCtl();enterStep();requestAnimationFrame(tick);
}
const ICON={play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',on:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 010 6"/></svg>',off:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M17 10l4 4M21 10l-4 4"/></svg>'};
function drawCtl(){const b=document.getElementById("pl-play");if(!b)return;b.innerHTML=PL.paused?ICON.play:ICON.pause;b.setAttribute("aria-label",PL.paused?"Reprendre":"Pause");const s=document.getElementById("pl-snd");s.innerHTML=sound?ICON.on:ICON.off;s.setAttribute("aria-label",sound?"Couper le son":"Activer le son")}
function jumpEx(dir){
  const cur=PL.steps[PL.i].xi,target=Math.max(0,cur+dir);
  if(target>=PL.list.length){finish();return}
  PL.i=PL.steps.findIndex(s=>s.xi===target);PL.elapsed=0;enterStep();
}
function enterStep(){
  const st=PL.steps[PL.i],e=EXOS[st.id],stage=document.getElementById("pl-stage");
  document.getElementById("pl-ex").textContent=`Exercice ${st.xi+1} / ${PL.list.length} · Séance ${PL.L}`;
  stopDemo();
  if(st.type==="intro"){
    const it=PL.list[st.xi];
    stage.innerHTML=`<div class="intro"><div class="eyebrow">À suivre · ${repsLabel(it)}</div><h1>${esc(e.n)}</h1><div class="fig" id="demo-fig"></div>${exDetail(e)}
      <div class="row"><button class="btn" id="pl-go">Je suis en place</button><span class="muted small num" id="pl-cd"></span></div></div>`;
    document.getElementById("pl-go").onclick=()=>{PL.elapsed=st.t};
    startDemo(st.id);PL.from=PL.to=0;beep("intro");
  }else{
    const osc=st.k==="cardio"||st.k==="free";
    PL.from=PL.to;PL.to=osc?0:poseIndex(st.id,st.k);
    stage.innerHTML=`<div class="reps">${esc((st.side?st.side+" · ":"")+(st.rep?(e.c?"Bloc ":"Répétition ")+st.rep+" / "+st.reps:""))}</div>
      <div class="fig" id="pl-fig"></div>
      <div class="cue" style="${st.k==="cardio"?"color:var(--cardio)":""}">${esc(st.txt)}</div>
      <div class="viz">
        <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="var(--sunk)" stroke-width="6"/><circle id="pl-arc" cx="50" cy="50" r="46" fill="none" stroke="${st.k==="cardio"?"var(--cardio)":"var(--accent)"}" stroke-width="6" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="0"/></svg><div class="t" id="pl-t"></div></div>
        <div class="col" aria-hidden="true"><i id="pl-col"></i></div>
        <div class="col-labels" aria-hidden="true"><span>nombril</span><span>bas‑ventre</span><span>périnée</span></div>
      </div>`;
    PL.lastDraw=0;beep(st.k);
  }
}
let colLevel=0;
function tick(now){
  if(!PL)return;
  const dt=(now-PL.last)/1000;PL.last=now;
  if(!PL.paused)PL.elapsed+=dt;
  const st=PL.steps[PL.i];
  if(PL.elapsed>=st.t){PL.elapsed=0;PL.i++;if(PL.i>=PL.steps.length){finish();return}enterStep()}
  else{
    const f=PL.elapsed/st.t,left=Math.ceil(st.t-PL.elapsed);
    if(st.type==="intro"){const cd=document.getElementById("pl-cd");if(cd)cd.textContent=`Départ dans ${left} s`}
    else{
      const t=document.getElementById("pl-t");if(t&&t.textContent!=String(left))t.textContent=left;
      const arc=document.getElementById("pl-arc");if(arc)arc.setAttribute("stroke-dashoffset",f1(289*f));
      let target=colLevel;
      if(st.k==="ex")target=f;else if(st.k==="hold")target=1;else if(st.k==="rest"||st.k==="in")target=Math.max(0,1-f);else target=0;
      colLevel+=(target-colLevel)*Math.min(1,dt*10);
      const col=document.getElementById("pl-col");if(col)col.style.height=f1(colLevel*100)+"%";
      if(now-PL.lastDraw>33){
        PL.lastDraw=now;
        const fig=document.getElementById("pl-fig"),ps=posesOf(st.id),an=ANIM[st.id]||ANIM.install;
        let j;
        if(st.k==="cardio"||st.k==="free"){const tt=PL.paused?0:(Math.sin(now/1000*2*Math.PI/(an.osc||2))+1)/2;j=lerpJ(ps[0],ps[1],ease(tt))}
        else if(st.k==="rest"&&e_c(st.id))j=ps[0];
        else j=lerpJ(ps[PL.from]||ps[0],ps[PL.to]||ps[0],ease(Math.min(1,f*1.15)));
        if(fig)fig.innerHTML=figSVG(st.id,j,{toString:()=>st.k,mirror:st.mirror});
      }
    }
  }
  const done=PL.steps.slice(0,PL.i).reduce((a,s)=>a+s.t,0)+PL.elapsed;
  const pg=document.getElementById("pl-prog");if(pg)pg.style.width=f1(100*done/PL.total)+"%";
  requestAnimationFrame(tick);
}
const e_c=id=>!!EXOS[id].c;
function confirmQuit(){
  PL.paused=true;drawCtl();stopDemo();
  document.getElementById("pl-stage").innerHTML=`<div class="intro"><h2>Arrêter la séance ?</h2><p class="muted">Une séance arrêtée n’est pas comptée. Si vous arrêtez à cause d’une gêne, c’est la bonne décision.</p>
   <div class="row"><button class="btn" id="q-keep">Continuer</button><button class="btn ghost" id="q-stop">Arrêter</button></div></div>`;
  document.getElementById("q-keep").onclick=()=>{PL.paused=false;PL.last=performance.now();drawCtl();enterStep()};
  document.getElementById("q-stop").onclick=closePlayer;
}
function closePlayer(){PL=null;stopDemo();layer.innerHTML="";try{wake&&wake.release()}catch(e){}wake=null;render()}
function finish(){
  const dur=Math.round((Date.now()-PL.t0)/1000),L=PL.L;PL=null;stopDemo();
  try{wake&&wake.release()}catch(e){}
  let fb=null,sym=null;
  layer.innerHTML=`<div class="player"><div></div><div class="stage"><div class="stage-in"><div class="intro">
    <div class="eyebrow">Séance ${L} terminée · ${fmtMin(dur)}</div><h1>Bravo. Comment c’était ?</h1>
    <div class="choice" id="fb"><button data-v="facile" aria-pressed="false">Facile, je pourrais faire plus</button><button data-v="ok" aria-pressed="false">Adaptée</button><button data-v="dur" aria-pressed="false">Difficile</button></div>
    <h3>Pendant ou après la séance, avez‑vous senti une pesanteur, une « boule » ou une fuite ?</h3>
    <div class="choice" id="sym"><button data-v="0" aria-pressed="false">Non</button><button data-v="1" aria-pressed="false">Oui</button></div>
    <button class="btn block" id="fb-save" disabled>Enregistrer la séance</button>
  </div></div></div><div></div></div>`;
  const upd=()=>{document.getElementById("fb-save").disabled=!(fb&&sym!==null)};
  document.querySelectorAll("#fb button").forEach(b=>b.onclick=()=>{fb=b.dataset.v;document.querySelectorAll("#fb button").forEach(x=>x.setAttribute("aria-pressed",x===b));upd()});
  document.querySelectorAll("#sym button").forEach(b=>b.onclick=()=>{sym=b.dataset.v==="1";document.querySelectorAll("#sym button").forEach(x=>x.setAttribute("aria-pressed",x===b));upd()});
  document.getElementById("fb-save").onclick=()=>{S.sessions.push({d:today(),phase:S.phase,s:L,fb,sym,dur});save();layer.innerHTML="";tab="today";render();toast("Séance enregistrée")};
}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}

/* ---------- sauvegarde ---------- */
function exportData(){
  try{const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="souffle-socle-"+today()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Sauvegarde enregistrée dans Téléchargements")}
  catch(e){toast("La sauvegarde n’a pas pu être créée sur cet appareil")}
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.sessions))throw 0;S=migrate(o);save();render();toast("Sauvegarde restaurée")}catch(e){toast("Ce fichier n’est pas une sauvegarde Souffle & Socle")}};
  r.readAsText(file);
}

/* ---------- événements ---------- */
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(b){tab=b.dataset.tab;menuOff=0;render();window.scrollTo(0,0)}});
app.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]"),ex=e.target.closest("[data-ex]"),sp=e.target.closest("[data-setphase]"),mn=e.target.closest("[data-menu]");
  if(ex)return exSheet(ex.dataset.ex);
  if(mn){menuOff+=+mn.dataset.menu;return render()}
  if(sp){S.phase=+sp.dataset.setphase;save();tab="today";render();return toast("Niveau "+(S.phase+1)+" sélectionné")}
  if(!a)return;
  const act=a.dataset.act;
  if(act==="start")startSession();
  if(act==="up"){S.phase=Math.min(PHASES.length-1,S.phase+1);save();render();toast("Niveau "+(S.phase+1)+" : "+P().key)}
  if(act==="down"){S.phase=Math.max(0,S.phase-1);save();render()}
  if(act==="export")exportData();
  if(act==="reset"){if(a.dataset.confirm){S=fresh();save();render();toast("Programme remis à zéro")}else{a.dataset.confirm="1";a.textContent="Confirmer : tout effacer";a.classList.remove("ghost")}}
});
app.addEventListener("change",e=>{if(e.target.id==="imp"&&e.target.files[0])importData(e.target.files[0])});
app.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="wform"){
    const kg=parseFloat(document.getElementById("kg").value);if(!(kg>=35&&kg<=200))return toast("Entrez un poids entre 35 et 200 kg");
    const d=today();S.weights=S.weights.filter(w=>w.d!==d);S.weights.push({d,kg:Math.round(kg*10)/10});save();render();toast("Poids enregistré");
  }
  if(e.target.id==="pform"){
    const v=id=>parseFloat(document.getElementById(id).value);
    const age=v("p-age"),h=v("p-h"),goal=v("p-goal");
    if(!(age>=18&&age<=90&&h>=130&&h<=210&&goal>=40&&goal<=150))return toast("Vérifiez l’âge, la taille et l’objectif");
    S.profile={age,h,goal,act:document.getElementById("p-act").value,allait:document.getElementById("p-al").value==="1"};save();render();toast("Profil mis à jour");
  }
});
layer.addEventListener("click",e=>{if(e.target.matches("[data-close]")&&!PL){stopDemo();layer.innerHTML=""}});
document.addEventListener("visibilitychange",()=>{if(PL&&document.visibilityState==="visible")lockWake()});
if(document.querySelector('link[rel="manifest"]')&&"serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script>
